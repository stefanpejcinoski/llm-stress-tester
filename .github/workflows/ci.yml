name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff linter
        run: ruff check src/

  # ── Tests ───────────────────────────────────────────────────────────────────
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest --tb=short -q

  # ── Build executables ────────────────────────────────────────────────────────
  # Runs on push to main/master and on release published (not PRs).
  # On release events the binary is also uploaded to the GitHub release.
  build:
    needs: [lint, test]
    if: github.event_name == 'push' || github.event_name == 'release'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            src: dist/llm-stress-tester.exe
            binary: llm-stress-tester-windows.exe
          - os: macos-latest
            src: dist/llm-stress-tester
            binary: llm-stress-tester-macos
          - os: ubuntu-latest
            src: dist/llm-stress-tester
            binary: llm-stress-tester-linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e "."
          pip install pyinstaller

      # --onefile        : single self-contained binary
      # --collect-data   : bundles Streamlit's static HTML/JS/CSS assets
      # --collect-all    : also captures Streamlit's internal Python modules
      # --hidden-import  : catches deps missed by PyInstaller's static analysis
      - name: Build with PyInstaller
        run: >
          pyinstaller
          --onefile
          --name llm-stress-tester
          --collect-data streamlit
          --collect-all streamlit
          --hidden-import streamlit
          --hidden-import pydantic
          --hidden-import httpx
          --hidden-import pandas
          --hidden-import matplotlib
          --hidden-import xlsxwriter
          --hidden-import llm_stress_tester
          launcher.py

      - name: Rename binary
        shell: bash
        run: mv "${{ matrix.src }}" "dist/${{ matrix.binary }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llm-stress-tester-${{ matrix.os }}
          path: dist/${{ matrix.binary }}
          retention-days: 30

      - name: Upload to release
        if: github.event_name == 'release'
        uses: AButler/upload-release-assets@v3.0
        with:
          files: dist/${{ matrix.binary }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
